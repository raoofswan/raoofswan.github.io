
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة معرض رؤوف صوان</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,sans-serif}
header{background:#ffdc25;padding:22px;text-align:center}
header h2{margin:0}
main{max-width:850px;margin:22px auto;padding:15px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 2px 9px #0000000d}
h3{margin-top:0}
input,textarea,select{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{border:0;border-radius:8px;padding:12px 17px;background:#ffdc25;font-weight:bold;cursor:pointer;margin:4px}
button.danger{background:#e74c3c;color:white}
button.dark{background:#222;color:white}
.product{border:1px solid #eee;padding:12px;border-radius:10px;margin:12px 0;display:flex;gap:12px;align-items:center}
.product img{width:85px;height:85px;object-fit:contain;border-radius:8px;background:#fafafa}
.product-info{flex:1;min-width:0}
.product-info p{margin:5px 0}
.small{font-size:13px;color:#777}
#dashboard{display:none}
#status{padding:10px;margin:10px 0;border-radius:8px;display:none}
@media(max-width:500px){.product{align-items:flex-start}.product img{width:65px;height:65px}}
</style>
</head>
<body>

<header>
<h2>معرض رؤوف صوان</h2>
<p>لوحة إدارة المنتجات</p>
</header>

<main>

<div id="status"></div>

<section id="login" class="card">
<h3>تسجيل دخول المدير</h3>
<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()" id="loginBtn">تسجيل الدخول</button>
</section>

<section id="dashboard">

<div class="card">
<h3>إدارة المنتجات</h3>
<p class="small">أضف منتجاً جديداً أو عدّل المنتجات الموجودة.</p>
<button onclick="resetForm()">إضافة منتج جديد +</button>
<button class="dark" onclick="loadProducts()">تحديث المنتجات</button>
<button class="danger" onclick="logout()">تسجيل الخروج</button>
</div>

<div class="card">
<h3 id="formTitle">إضافة منتج جديد</h3>

<input type="hidden" id="productId">

<label>اسم المنتج *</label>
<input id="name" placeholder="مثال: دمية باتمان">

<label>وصف المنتج</label>
<textarea id="description" placeholder="وصف المنتج"></textarea>

<label>السعر بالشيكل *</label>
<input id="price" type="number" min="0" step="0.01" placeholder="29">

<label>السعر الأصلي (اختياري)</label>
<input id="original_price" type="number" min="0" step="0.01" placeholder="35">

<label>التصنيف</label>
<input id="category" placeholder="ألعاب أطفال">

<label>صورة المنتج</label>
<input id="image" type="file" accept="image/*">
<p class="small">اترك الصورة فارغة عند تعديل المنتج للاحتفاظ بالصورة القديمة.</p>

<label>
<input id="is_offer" type="checkbox" style="width:auto">
 المنتج ضمن العروض
</label>
<br>
<label>
<input id="is_available" type="checkbox" checked style="width:auto">
 المنتج متوفر
</label>

<br><br>
<button onclick="saveProduct()" id="saveBtn">حفظ المنتج</button>
<button class="dark" onclick="resetForm()">إلغاء</button>
</div>

<div class="card">
<h3>المنتجات الحالية</h3>
<div id="productsList">جاري تحميل المنتجات...</div>
</div>

</section>
</main>

<script>
const SUPABASE_URL = 'https://txnfwgchvsxnrgkprdbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e0PmhZqG262UAjdob6clmA_BNaBXEV4';

const ADMIN_UID = '1bd85c46-1681-4ecc-a351-407cc8602dbd';
const BUCKET = 'products_images';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function message(text, error=false){
  const box=document.getElementById('status');
  box.style.display='block';
  box.style.background=error?'#ffe5e5':'#e4f7e8';
  box.style.color=error?'#a00':'#17652b';
  box.textContent=text;
}

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn');

  if(!email || !password){
    return message('أدخل البريد الإلكتروني وكلمة المرور',true);
  }

  btn.disabled=true;
  btn.textContent='جاري الدخول...';

  try{
    const {data,error}=await db.auth.signInWithPassword({
      email,password
    });

    if(error) throw error;

    if(data.user.id !== ADMIN_UID){
      await db.auth.signOut();
      throw new Error('هذا الحساب ليس حساب المدير المصرح له');
    }

    document.getElementById('login').style.display='none';
    document.getElementById('dashboard').style.display='block';

    message('تم تسجيل الدخول بنجاح');
    await loadProducts();

  }catch(e){
    message('تعذر تسجيل الدخول: '+e.message,true);
  }finally{
    btn.disabled=false;
    btn.textContent='تسجيل الدخول';
  }
}

async function checkSession(){
  const {data,error}=await db.auth.getSession();
  if(error || !data.session) return;

  if(data.session.user.id !== ADMIN_UID){
    await db.auth.signOut();
    return;
  }

  document.getElementById('login').style.display='none';
  document.getElementById('dashboard').style.display='block';
  await loadProducts();
}

async function logout(){
  await db.auth.signOut();
  document.getElementById('dashboard').style.display='none';
  document.getElementById('login').style.display='block';
  message('تم تسجيل الخروج');
}

async function loadProducts(){
  const list=document.getElementById('productsList');
  list.textContent='جاري التحميل...';

  try{
    const {data,error}=await db
      .from('products')
      .select('*')
      .order('created_at',{ascending:false});

    if(error) throw error;

    if(!data.length){
      list.textContent='لا توجد منتجات حالياً';
      return;
    }

    list.innerHTML='';

    data.forEach(p=>{
      const item=document.createElement('div');
      item.className='product';

      const img=document.createElement('img');
      img.src=p.image_url || '';
      img.alt=p.name || 'منتج';

      const info=document.createElement('div');
      info.className='product-info';

      const name=document.createElement('strong');
      name.textContent=p.name || '';

      const price=document.createElement('p');
      price.textContent='السعر: '+p.price+' شيكل';

      const category=document.createElement('p');
      category.className='small';
      category.textContent=p.category || 'بدون تصنيف';

      const status=document.createElement('p');
      status.className='small';
      status.textContent=p.is_available?'متوفر':'غير متوفر';

      const edit=document.createElement('button');
      edit.textContent='تعديل';
      edit.onclick=()=>editProduct(p);

      const del=document.createElement('button');
      del.textContent='حذف';
      del.className='danger';
      del.onclick=()=>deleteProduct(p.id);

      info.append(name,price,category,status,edit,del);
      item.append(img,info);
      list.appendChild(item);
    });

  }catch(e){
    list.textContent='خطأ في تحميل المنتجات: '+e.message;
  }
}

function resetForm(){
  document.getElementById('productId').value='';
  document.getElementById('name').value='';
  document.getElementById('description').value='';
  document.getElementById('price').value='';
  document.getElementById('original_price').value='';
  document.getElementById('category').value='';
  document.getElementById('image').value='';
  document.getElementById('is_offer').checked=false;
  document.getElementById('is_available').checked=true;
  document.getElementById('formTitle').textContent='إضافة منتج جديد';
  document.getElementById('saveBtn').textContent='حفظ المنتج';
}

function editProduct(p){
  document.getElementById('productId').value=p.id;
  document.getElementById('name').value=p.name||'';
  document.getElementById('description').value=p.description||'';
  document.getElementById('price').value=p.price;
  document.getElementById('original_price').value=p.original_price??'';
  document.getElementById('category').value=p.category||'';
  document.getElementById('is_offer').checked=!!p.is_offer;
  document.getElementById('is_available').checked=!!p.is_available;
  document.getElementById('image').value='';
  document.getElementById('formTitle').textContent='تعديل المنتج';
  document.getElementById('saveBtn').textContent='حفظ التعديلات';

  window.scrollTo({top:0,behavior:'smooth'});
}

async function saveProduct(){
  const id=document.getElementById('productId').value;
  const name=document.getElementById('name').value.trim();
  const price=document.getElementById('price').value;
  const file=document.getElementById('image').files[0];

  if(!name || price==='' || Number(price)<0){
    return message('أدخل اسم المنتج وسعراً صحيحاً',true);
  }

  const btn=document.getElementById('saveBtn');
  btn.disabled=true;
  btn.textContent='جاري الحفظ...';

  try{
    let image_url=null;

    if(file){
      if(!file.type.startsWith('image/')){
        throw new Error('الملف المختار ليس صورة');
      }

      const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
      const path=Date.now()+'-'+crypto.randomUUID()+'.'+ext;

      const {error:uploadError}=await db.storage
        .from(BUCKET)
        .upload(path,file,{upsert:false});

      if(uploadError) throw uploadError;

      const {data:urlData}=db.storage
        .from(BUCKET)
        .getPublicUrl(path);

      image_url=urlData.publicUrl;
    }

    const product={
      name,
      description:document.getElementById('description').value.trim(),
      price:Number(price),
      original_price:document.getElementById('original_price').value===''
        ?null:Number(document.getElementById('original_price').value),
      category:document.getElementById('category').value.trim()||null,
      is_offer:document.getElementById('is_offer').checked,
      is_available:document.getElementById('is_available').checked
    };

    if(image_url) product.image_url=image_url;

    let result;

    if(id){
      result=await db.from('products').update(product).eq('id',id);
    }else{
      result=await db.from('products').insert(product);
    }

    if(result.error) throw result.error;

    message(id?'تم تعديل المنتج بنجاح':'تمت إضافة المنتج بنجاح');
    resetForm();
    await loadProducts();

  }catch(e){
    message('تعذر حفظ المنتج: '+e.message,true);
  }finally{
    btn.disabled=false;
    btn.textContent=id?'حفظ التعديلات':'حفظ المنتج';
  }
}

async function deleteProduct(id){
  if(!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;

  try{
    const {error}=await db.from('products').delete().eq('id',id);
    if(error) throw error;

    message('تم حذف المنتج');
    await loadProducts();

  }catch(e){
    message('تعذر حذف المنتج: '+e.message,true);
  }
}

checkSession();
</script>
</body>
</html>
